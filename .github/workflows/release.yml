name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # Full history so the annotated tag object, which holds the release text, is available.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Skipped when the signing secrets are not set: the build then produces an
      # unsigned APK, which is published but cannot be installed.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/keystore.jks" ]; then
            export KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
          fi
          ./gradlew assembleRelease

      # The tag message describes what the version brings; the changelog is appended to it.
      - name: Read the release text from the tag
        run: |
          {
            echo "RELEASE_BODY<<RELEASE_BODY_EOF"
            git tag --list --format='%(contents:body)' "$GITHUB_REF_NAME"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body: ${{ env.RELEASE_BODY }}
          generate_release_notes: true
