name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Skipped when the signing secrets are not set: the build then produces an
      # unsigned APK, which is published but cannot be installed.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/keystore.jks" ]; then
            export KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
          fi
          ./gradlew assembleRelease

      # The tag message describes what the version brings; the changelog is appended to it.
      # It is read over the API because the checkout does not keep the annotated tag object.
      - name: Read the release text from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          message=""
          if [ "$(echo "$ref" | jq -r '.object.type')" = "tag" ]; then
            sha=$(echo "$ref" | jq -r '.object.sha')
            # Drop the first line, which is the tag subject and would repeat the title.
            message=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' | tail -n +2)
          fi
          {
            echo "RELEASE_BODY<<RELEASE_BODY_EOF"
            echo "$message"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body: ${{ env.RELEASE_BODY }}
          generate_release_notes: true
